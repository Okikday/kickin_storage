name: kickin_storage
description: "Kickin Storage provides useful storage utilities for easy kicking with your flutter project."
version: 0.0.1-dev.3
homepage: https://github.com/okikday/kickin_storage/readme.md
repository: https://github.com/okikday/kickin_storage

environment:
  sdk: ^3.9.5
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

